# Drupal.org GitLab CI template: PHPCS, PHPStan, CSpell, ESLint, PHPUnit.
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # The French translation is not English: keep it out of the spell check.
  _CSPELL_IGNORE_PATHS: '"translations/*"'
